name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload the bundle to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Play release status
        type: choice
        options: [completed, draft]
        default: draft
      version_name:
        description: versionName override (defaults to package.json)
        type: string
        required: false

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: com.muganwas.BIMmobile
  NODE_VERSION: '24'
  JAVA_VERSION: '17'
  NDK_VERSION: '27.1.12297006'
  # Play requires a strictly increasing versionCode, so CI derives it from the
  # run number. Raise this variable if the app already has higher codes.
  VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '1000' }}

jobs:
  release:
    name: Build AAB and upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          version_name="$INPUT_VERSION_NAME"
          if [ -z "$version_name" ]; then
            version_name="$(node -p "require('./package.json').version")"
          fi
          version_code=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building ${version_name} (${version_code})"

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          [ -n "$PLAY_JSON" ] || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set"; exit 1; }

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # expo-notifications mints FCM device tokens from this file. It is
      # gitignored, so the commit carries no Firebase config — keep the build
      # green when the secret is absent and say so instead of failing silently.
      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set — this build ships without push notifications"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r' > /tmp/google-services.secret
          if [ "$(head -c 1 /tmp/google-services.secret)" = "{" ]; then
            # The secret was pasted as the raw file.
            cp /tmp/google-services.secret android/app/google-services.json
          else
            # The secret was pasted as base64 (the default in the docs).
            base64 --decode /tmp/google-services.secret > android/app/google-services.json
          fi
          node -e "JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8')); console.log('google-services.json is valid JSON')"

      - name: Ensure required NDK
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi

      - name: Build release bundle
        working-directory: android
        env:
          ENV: production
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://bim.sibuna.us' }}
          COUNTRY_CODE: ${{ vars.COUNTRY_CODE || '+256' }}
          COUNTRY_NAME: ${{ vars.COUNTRY_NAME || 'Uganda' }}
          PHONE_NUMBER_LENGTH: ${{ vars.PHONE_NUMBER_LENGTH || '10' }}
          BIM_UPLOAD_STORE_FILE: release.keystore
          BIM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BIM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BIM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.versionCode=${{ steps.version.outputs.code }} \
            -Pandroid.versionName=${{ steps.version.outputs.name }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bim-mobile-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          # Repository variables keep the first merge-to-main run a draft; set
          # RELEASE_STATUS=completed once the pipeline is proven.
          track: ${{ inputs.track || vars.RELEASE_TRACK || 'internal' }}
          status: ${{ inputs.status || vars.RELEASE_STATUS || 'draft' }}
